[project]
name = "vat-ingest"
version = "0.1.0"
description = "VAT chatbot ingest pipeline (fetch, parse, chunk, embed)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "pydantic>=2.7",
    "tiktoken>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]
