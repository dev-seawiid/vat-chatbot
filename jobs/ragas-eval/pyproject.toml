[project]
name = "ragas-eval"
version = "0.1.0"
description = "VAT chatbot RAGAS scoring plane (ragas v0.3 API)"
requires-python = ">=3.12"
dependencies = [
    "ragas>=0.3",
    "litellm>=1.50",
    "instructor>=1.5",
    "langfuse>=3.0,<4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragas_eval"]
