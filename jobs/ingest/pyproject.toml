[project]
name = "vat-ingest"
version = "0.1.0"
description = "VAT chatbot ingest pipeline (fetch, parse, chunk, embed)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "tiktoken>=0.7",
    "voyageai>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]
